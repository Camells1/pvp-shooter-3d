name: Build & Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Version-less copy so the website can always link to .../releases/latest/download/Riftline-Setup.exe
      - run: Copy-Item (Get-ChildItem dist/Riftline-Setup-*.exe | Select-Object -First 1).FullName dist/Riftline-Setup.exe
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
